[project]
name = "exposure-auditor"
version = "0.1.0"
description = "Audit your own public data exposure and get a remediation plan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "anthropic[bedrock]>=1.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-sdk>=1.44",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
exposure-auditor = "exposure_auditor.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Letter templates: paragraphs stay on one line so they reflow in mail clients.
"src/exposure_auditor/remediation/letters.py" = ["E501"]
