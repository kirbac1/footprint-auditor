name: deploy-demo

# Deploys the public demo to Cloud Run, and only after ci has passed on main:
# a red build should never reach the thing people click on.
#
# Setup once: deploy/cloudrun/setup-github-oidc.sh. It creates a service
# account and a workload identity pool, so no Google key ever lives in a
# repository secret.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for Google, in place of a long-lived service-account key

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run deploys what is on main; an automatic one only follows a
    # green ci.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ steps.deploy.outputs.url || steps.deploy_bedrock.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Two deploys, one shape: the second adds a real model. Keeping them
      # separate means the scripted demo never carries half-set AWS variables,
      # which would build a client that fails in the middle of a scan.
      - id: deploy
        if: vars.MODEL_PROVIDER != 'bedrock'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: footprint-auditor
          source: .
          region: ${{ vars.GCP_REGION || 'europe-north1' }}
          flags: --allow-unauthenticated --memory=1Gi --cpu=1 --min-instances=0 --max-instances=1
          # Demo mode is not a default to be forgotten: a deployment that
          # dropped it would show strangers real findings about themselves
          # from a database in /tmp.
          env_vars: |
            EA_ENV=dev
            EA_DEMO_SCANS=true
            EA_VERIFICATION_DELIVERY=console
            EA_DATABASE_URL=sqlite+aiosqlite:////tmp/footprint.db
            EA_SCANS_PER_DAY=20
          secrets: |
            EA_JWT_SECRET=EA_JWT_SECRET:latest
            EA_FIELD_ENCRYPTION_KEY=EA_FIELD_ENCRYPTION_KEY:latest
            EA_BLIND_INDEX_KEY=EA_BLIND_INDEX_KEY:latest

      - id: deploy_bedrock
        if: vars.MODEL_PROVIDER == 'bedrock'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: footprint-auditor
          source: .
          region: ${{ vars.GCP_REGION || 'europe-north1' }}
          flags: --allow-unauthenticated --memory=1Gi --cpu=1 --min-instances=0 --max-instances=1
          # The web stays synthetic; the model is real: gpt-oss-120b on Bedrock,
          # through its OpenAI-compatible endpoint with a Bedrock API key. That
          # is the path this account is entitled to -- the Messages API endpoint
          # reported the Claude models as nonexistent, and the proprietary GPT
          # models need AWS Sales. It also measured best in the eval: recall
          # 0.969, no namesake leaks, 25 s at p95, about half a cent a case.
          env_vars: |
            EA_ENV=dev
            EA_DEMO_SCANS=true
            EA_VERIFICATION_DELIVERY=console
            EA_DATABASE_URL=sqlite+aiosqlite:////tmp/footprint.db
            EA_LLM_PROVIDER=openai
            EA_OPENAI_BASE_URL=https://bedrock-runtime.${{ vars.EA_BEDROCK_REGION || 'eu-central-1' }}.amazonaws.com/openai/v1
            EA_MODEL_ID=${{ vars.EA_MODEL_ID || 'openai.gpt-oss-120b-1:0' }}
            EA_PRICE_INPUT_PER_MTOK=${{ vars.EA_PRICE_INPUT_PER_MTOK || '0.15' }}
            EA_PRICE_OUTPUT_PER_MTOK=${{ vars.EA_PRICE_OUTPUT_PER_MTOK || '0.60' }}
            EA_MAX_SCAN_COST_USD=${{ vars.EA_MAX_SCAN_COST_USD || '0.25' }}
            EA_SCANS_PER_DAY=${{ vars.EA_SCANS_PER_DAY || '10' }}
            EA_SCANS_PER_DAY_TOTAL=${{ vars.EA_SCANS_PER_DAY_TOTAL || '100' }}
            EA_DEMO_ACCOUNT_PUBLISHED=${{ vars.EA_DEMO_ACCOUNT_PUBLISHED || 'false' }}
            EA_REGISTRATION_OPEN=${{ vars.EA_REGISTRATION_OPEN || 'false' }}
          secrets: |
            EA_JWT_SECRET=EA_JWT_SECRET:latest
            EA_FIELD_ENCRYPTION_KEY=EA_FIELD_ENCRYPTION_KEY:latest
            EA_BLIND_INDEX_KEY=EA_BLIND_INDEX_KEY:latest
            EA_OPENAI_API_KEY=EA_OPENAI_API_KEY:latest
            EA_DEMO_PASSWORD=EA_DEMO_PASSWORD:latest

      - name: Check the deployment answers
        env:
          EXPECT_REAL_MODEL: ${{ vars.MODEL_PROVIDER == 'bedrock' }}
        run: |
          url="${{ steps.deploy.outputs.url || steps.deploy_bedrock.outputs.url }}"
          echo "deployed to $url"
          # Cold start plus migrations: give it a moment before judging it.
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/meta" -o meta.json; then break; fi
            sleep 5
          done
          cat meta.json
          python3 - <<'PY'
          import json, os, sys
          meta = json.load(open("meta.json"))
          if not meta["demo_scans"]:
              sys.exit("refusing to call this a demo: EA_DEMO_SCANS is off")
          if not meta["scans_available"]:
              sys.exit("deployed, but scans are unavailable")
          if os.environ.get("EXPECT_REAL_MODEL") == "true" and meta.get("scripted_model"):
              sys.exit("expected a real model, but the demo fell back to the scripted one")
          print("demo is live, with the scripted model and synthetic results")
          PY
