# Local service: the API, a scan worker and Postgres, the same shape as the
# planned ECS + RDS deployment.
#
#   docker compose up -d --build
#   docker compose logs -f api                 # verification codes appear here in dev
#   docker compose --profile tracing up -d     # adds Jaeger at http://127.0.0.1:16686
#
# Secrets come from .env (scripts/dev_env.py writes it). Every port stays on
# loopback: this service holds PII and has no business on the LAN.

x-app-env: &app-env
  # Overrides the SQLite URL in .env for the containerized service.
  EA_DATABASE_URL: postgresql+asyncpg://auditor:${POSTGRES_PASSWORD}@db:5432/auditor
  # The API only queues scans; the worker container runs them.
  EA_SCAN_EXECUTION: worker
  # PayPal donate link for the header button; empty hides it.
  EA_DONATE_URL: ${EA_DONATE_URL:-}
  # Scan traces as OpenTelemetry spans (content-free); needs the tracing profile.
  EA_OTEL_ENABLED: ${EA_OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_DB: auditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev_env.py to create .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: exposure-auditor:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: exposure-auditor:local
    restart: unless-stopped
    command: ["/app/.venv/bin/exposure-auditor", "worker"]
    depends_on:
      api:
        # The API applies migrations before it reports healthy.
        condition: service_healthy
    env_file: .env
    environment: *app-env

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: ["tracing"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
