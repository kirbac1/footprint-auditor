# Data-broker / people-search registry.
#
# Every entry has last_verified: null. Opt-out URLs and procedures change
# often and none of these have been re-checked against the live sites for
# this release. Run `uv run python scripts/check_brokers.py` to see which
# URLs still resolve, then confirm the procedure by hand and set
# last_verified to the date you did. The API surfaces last_verified with
# every remediation item so users can see how fresh the route is.

brokers:
  - id: spokeo
    name: Spokeo
    domains: [spokeo.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.spokeo.com/optout
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: Opt-out takes the profile URL and an email address for confirmation.
    last_verified: null

  - id: whitepages
    name: Whitepages
    domains: [whitepages.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.whitepages.com/suppression-requests
    requires_id_verification: true
    legal_bases: [ccpa]
    notes: Suppression flow has asked for a phone call verification in the past.
    last_verified: null

  - id: beenverified
    name: BeenVerified
    domains: [beenverified.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.beenverified.com/app/optout/search
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: peopleconnect
    name: PeopleConnect (Intelius, TruthFinder, Instant Checkmate, US Search)
    domains: [intelius.com, truthfinder.com, instantcheckmate.com, ussearch.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://suppression.peopleconnect.us/login
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: One suppression request covers the PeopleConnect family of sites.
    last_verified: null

  - id: radaris
    name: Radaris
    domains: [radaris.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://radaris.com/control/privacy
    requires_id_verification: true
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: fastpeoplesearch
    name: FastPeopleSearch
    domains: [fastpeoplesearch.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.fastpeoplesearch.com/removal
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: truepeoplesearch
    name: TruePeopleSearch
    domains: [truepeoplesearch.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.truepeoplesearch.com/removal
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: mylife
    name: MyLife
    domains: [mylife.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.mylife.com/ccpa/index.pubview
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: peoplefinders
    name: PeopleFinders
    domains: [peoplefinders.com]
    jurisdictions: [US]
    method: web_form
    opt_out_url: https://www.peoplefinders.com/opt-out
    requires_id_verification: false
    legal_bases: [ccpa]
    notes: ""
    last_verified: null

  - id: acxiom
    name: Acxiom
    domains: [acxiom.com]
    jurisdictions: [US, EU]
    method: web_form
    opt_out_url: https://isapps.acxiom.com/optout/optout.aspx
    requires_id_verification: false
    legal_bases: [ccpa, gdpr]
    notes: Marketing-data broker; has no public profile pages, so discovery will rarely surface it. Listed for completeness of the opt-out sweep.
    last_verified: null

  # Fonecta's own privacy pages direct removal requests for number and address
  # listings to your telephone operator, which forwards them to every directory
  # service (checked via Fonecta's privacy statement and support FAQ, 2026-09-11).
  - id: fonecta
    name: Fonecta (Finder.fi)
    domains: [finder.fi, fonecta.fi]
    jurisdictions: [FI, EU]
    method: operator
    opt_out_url: https://www.fonecta.fi/ehdot-ja-tietosuoja/tietosuoja
    requires_id_verification: false
    legal_bases: [gdpr]
    notes: >-
      Fonecta asks people to make removal requests through their telephone operator,
      which passes them on to every directory service. Ask for an unlisted number and
      address; the letter below covers anything the operator route doesn't.
    notes_fi: >-
      Fonecta ohjaa tekemään poistopyynnöt oman puhelinoperaattorin kautta, joka välittää
      ne kaikille numeropalveluille. Pyydä salaista numeroa ja osoitetta; alla oleva
      kirje kattaa sen, mitä operaattorin kautta ei hoideta.
    last_verified: null
