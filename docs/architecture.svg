    .th { font-size: 14px; font-weight: 500; text-anchor: middle; }
    .ts { font-size: 12px; text-anchor: middle; }
    .tech { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; text-anchor: middle; }
    .legend, .frame-label { font-size: 12px; fill: #5F5E5A; text-anchor: start; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; fill: none; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts, .purple .tech { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts, .teal .tech { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts, .gray .tech { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
