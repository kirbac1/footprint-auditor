<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
  <title id="title">What is swappable and what is fixed</title>
  <desc id="desc">The React app talks to the FastAPI service. Inside it, a fixed core holds the ownership gate, the scope guard, the claim check, the namesake rules and the rule-based plan: this is the part that does not change when anything else does. Around it, five ports each have more than one implementation: the model port speaks to Claude on Bedrock, Foundry or the Anthropic API, or to any OpenAI-compatible endpoint: gpt-oss-120b on Amazon Bedrock, which the live demo runs, or Ollama on the user's own machine; web search speaks to Brave or to a fixture replay used by the evals; reverse image to TinEye or nothing; code delivery to SES and SNS, the console, or a test outbox; storage to PostgreSQL or SQLite. Swapping the model changes one environment variable and no guard.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; dominant-baseline: central; }
    .th { font-size: 13px; font-weight: 500; text-anchor: middle; }
    .ts { font-size: 11.5px; text-anchor: middle; }
    .tech { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; text-anchor: middle; }
    .legend, .frame-label { font-size: 12px; fill: #5F5E5A; text-anchor: start; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; fill: none; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts, .purple .tech { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts, .teal .tech { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts, .gray .tech { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
      .arr, .head { stroke: #9C9A92; }
      .legend, .frame-label { fill: #B4B2A9; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #CECBF6; } .purple .ts, .purple .tech { fill: #AFA9EC; }
      .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #9FE1CB; } .teal .ts, .teal .tech { fill: #5DCAA5; }
      .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .th { fill: #D3D1C7; } .gray .ts, .gray .tech { fill: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="teal">
    <rect x="150" y="20" width="380" height="112" rx="10" stroke-width="1.5"/>
    <text class="th" x="340" y="42">The part that does not change</text>
    <text class="ts" x="340" y="62">Ownership gate · ScopeGuard · claim check</text>
    <text class="ts" x="340" y="80">Namesake rules · suppression · audit log</text>
    <text class="ts" x="340" y="98">Plan and letters, from rules not a model</text>
    <text class="tech" x="340" y="118">tested, and identical for every provider</text>
  </g>

  <line class="arr" x1="194" y1="132" x2="194" y2="196" marker-end="url(#arrow)"/>
  <line class="arr" x1="366" y1="132" x2="366" y2="196" marker-end="url(#arrow)"/>
  <line class="arr" x1="498" y1="132" x2="498" y2="196" marker-end="url(#arrow)"/>
  <line class="arr" x1="608" y1="132" x2="608" y2="196" marker-end="url(#arrow)"/>

  <text class="frame-label" x="24" y="170">Ports</text>
  <text class="frame-label" x="24" y="188" style="font-size:10.5px">one interface</text>
  <text class="frame-label" x="24" y="204" style="font-size:10.5px">each, two or</text>
  <text class="frame-label" x="24" y="220" style="font-size:10.5px">more of each</text>

  <g class="purple">
    <rect x="104" y="198" width="180" height="92" rx="8" stroke-width="1"/>
    <text class="th" x="194" y="218">Model</text>
    <text class="tech" x="194" y="236">.messages.create()</text>
    <text class="ts" x="194" y="256">Claude: Bedrock · Foundry · API</text>
    <text class="ts" x="194" y="274">gpt-oss on Bedrock · Ollama</text>
  </g>
  <g class="gray">
    <rect x="296" y="198" width="140" height="92" rx="8" stroke-width="1"/>
    <text class="th" x="366" y="218">Web search</text>
    <text class="tech" x="366" y="236">SearchProvider</text>
    <text class="ts" x="366" y="256">Brave, paced to its tier</text>
    <text class="ts" x="366" y="274">Fixture replay in evals</text>
  </g>
  <g class="gray">
    <rect x="448" y="198" width="100" height="92" rx="8" stroke-width="1"/>
    <text class="th" x="498" y="218">Code delivery</text>
    <text class="tech" x="498" y="236">CodeSender</text>
    <text class="ts" x="498" y="256">SES · SNS</text>
    <text class="ts" x="498" y="274">console · outbox</text>
  </g>
  <g class="gray">
    <rect x="560" y="198" width="96" height="92" rx="8" stroke-width="1"/>
    <text class="th" x="608" y="218">Storage</text>
    <text class="tech" x="608" y="236">SQLAlchemy</text>
    <text class="ts" x="608" y="256">PostgreSQL</text>
    <text class="ts" x="608" y="274">SQLite in tests</text>
  </g>

  <g class="gray">
    <rect x="296" y="308" width="140" height="60" rx="8" stroke-width="1"/>
    <text class="th" x="366" y="328">Reverse image</text>
    <text class="tech" x="366" y="346">ReverseImageProvider</text>
    <text class="ts" x="366" y="360">TinEye, or not offered</text>
  </g>

  <rect class="frame" x="24" y="398" width="632" height="86" rx="12"/>
  <text class="frame-label" x="40" y="418">Swapping the model is one line, and no guard changes</text>
  <text class="tech" x="40" y="444" style="text-anchor:start">EA_LLM_PROVIDER=ollama    # free, local, nothing leaves the machine</text>
  <text class="tech" x="40" y="464" style="text-anchor:start">EA_LLM_PROVIDER=openai    # gpt-oss-120b on Bedrock (the live demo)</text>

  <g class="teal"><rect x="180" y="512" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="200" y="518">Fixed core</text>
  <g class="purple"><rect x="310" y="512" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="330" y="518">The only AI</text>
  <g class="gray"><rect x="440" y="512" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="460" y="518">Swappable outside</text>
</svg>
