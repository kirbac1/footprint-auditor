<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" aria-labelledby="title desc">
  <title id="title">Inside the scan agent</title>
  <desc id="desc">The model — gpt-oss-120b on Amazon Bedrock, Claude Opus 5 through Bedrock, Foundry or the Anthropic API, or Qwen3 running locally under Ollama — chooses what to search and judges each page. Its searches pass through ScopeGuard, which only allows queries containing the account holder's own details and rejects OR, pipe and AROUND operators, then go to the Brave Search API, or to a fixture replay during evals, whose results return to the model. Its findings pass through record_finding, which checks each claim against the page text and sends pages with text aimed at AI agents to review. Results are sorted into about you, needs your review, or namesake, which is counted but never saved. The user settles pages in review with This is me or Not me.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; dominant-baseline: central; }
    .th { font-size: 14px; font-weight: 500; text-anchor: middle; }
    .ts { font-size: 12px; text-anchor: middle; }
    .tech { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; text-anchor: middle; }
    .legend { font-size: 12px; fill: #5F5E5A; text-anchor: start; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; fill: none; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts, .purple .tech { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts, .teal .tech { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts, .gray .tech { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
      .arr, .head { stroke: #9C9A92; }
      .legend { fill: #B4B2A9; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #CECBF6; } .purple .ts, .purple .tech { fill: #AFA9EC; }
      .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #9FE1CB; } .teal .ts, .teal .tech { fill: #5DCAA5; }
      .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .th { fill: #D3D1C7; } .gray .ts, .gray .tech { fill: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="purple">
    <rect x="200" y="24" width="280" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="44">gpt-oss-120b, Opus 5 or Qwen3</text>
    <text class="ts" x="340" y="64">Chooses searches, judges pages</text>
    <text class="tech" x="340" y="82">Bedrock, or Ollama locally</text>
  </g>
  <path class="arr" d="M260 96 L260 120 L160 120 L160 148" marker-end="url(#arrow)"/>
  <path class="arr" d="M420 96 L420 120 L520 120 L520 148" marker-end="url(#arrow)"/>

  <g class="teal">
    <rect x="40" y="150" width="240" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="160" y="170">search_web</text>
    <text class="ts" x="160" y="190">ScopeGuard: your details only</text>
    <text class="tech" x="160" y="208">no OR, | or AROUND()</text>
  </g>
  <g class="teal">
    <rect x="400" y="150" width="240" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="520" y="170">record_finding</text>
    <text class="ts" x="520" y="190">Claims checked against text</text>
    <text class="tech" x="520" y="208">suspicious text → review</text>
  </g>

  <line class="arr" x1="160" y1="222" x2="160" y2="268" marker-end="url(#arrow)"/>
  <g class="gray">
    <rect x="40" y="270" width="240" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="160" y="290">Brave Search API</text>
    <text class="ts" x="160" y="310">Results go back to the model</text>
    <text class="tech" x="160" y="328">fixture replay in evals</text>
  </g>
  <path class="arr" d="M280 306 L320 306 L320 98" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <path class="arr" d="M520 222 L520 372 L133 372 L133 398" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 372 L340 398" marker-end="url(#arrow)"/>
  <path class="arr" d="M520 372 L547 372 L547 398" marker-end="url(#arrow)"/>

  <g class="gray">
    <rect x="40" y="400" width="186" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="133" y="418">About you</text>
    <text class="ts" x="133" y="438">Goes into the plan</text>
    <text class="tech" x="133" y="456">cited page, stored</text>
  </g>
  <g class="gray">
    <rect x="247" y="400" width="186" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="418">Needs your review</text>
    <text class="ts" x="340" y="438">Name only or suspicious</text>
    <text class="tech" x="340" y="456">This is me · Not me</text>
  </g>
  <g class="gray">
    <rect x="454" y="400" width="186" height="72" rx="8" stroke-width="1"/>
    <text class="th" x="547" y="418">Namesake</text>
    <text class="ts" x="547" y="438">Counted, never saved</text>
    <text class="tech" x="547" y="456">context contradicts</text>
  </g>

  <g class="purple"><rect x="150" y="506" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="170" y="512">AI decides</text>
  <g class="teal"><rect x="290" y="506" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="310" y="512">Code enforces</text>
  <g class="gray"><rect x="440" y="506" width="12" height="12" rx="2" stroke-width="1"/></g>
  <text class="legend" x="460" y="512">Outside or result</text>
</svg>
